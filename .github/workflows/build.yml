name: Build and Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build, test and generate JaCoCo reports
        run: mvn -q verify jacoco:report -DskipFrontendBuild=true

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          format: jacoco
          base-path: .
          fail-on-error: true
          files: >-
            springdoc-plus-core/target/site/jacoco/jacoco.xml
            springdoc-plus-gateway-spring-boot-starter/target/site/jacoco/jacoco.xml
            springdoc-plus-openapi3-spring-boot-starter/target/site/jacoco/jacoco.xml
            springdoc-plus-samples/gateway-sample/target/site/jacoco/jacoco.xml
            springdoc-plus-samples/user-service-sample/target/site/jacoco/jacoco.xml
            springdoc-plus-samples/order-service-sample/target/site/jacoco/jacoco.xml

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: springdoc-plus-web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./springdoc-plus-web
        run: pnpm install

      - name: Build frontend
        working-directory: ./springdoc-plus-web
        run: pnpm build
