name: deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: springdoc-plus-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./springdoc-plus-web
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        shell: pwsh
        run: ./scripts/check-version-consistency.ps1

      - name: Test frontend
        working-directory: ./springdoc-plus-web
        run: pnpm test

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Verify Maven modules and sample smoke tests
        run: mvn -q -Pfrontend verify jacoco:report

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            */target/*.jar
            */target/*.pom

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: springdoc-plus-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ./springdoc-plus-web
        run: pnpm install --frozen-lockfile

      - name: Check version consistency
        shell: pwsh
        run: ./scripts/check-version-consistency.ps1

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Create Maven settings.xml
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $settingsDirectory = Join-Path $HOME '.m2'
          $settingsPath = Join-Path $settingsDirectory 'settings.xml'
          $settingsContent = @'
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.CENTER_USERNAME}</username>
                <password>${env.CENTER_PASSWORD}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>release</id>
                <properties>
                  <gpg.passphrase>${env.GPG_PASSPHRASE}</gpg.passphrase>
                </properties>
              </profile>
            </profiles>
          </settings>
          '@

          $null = New-Item -ItemType Directory -Path $settingsDirectory -Force
          Set-Content -LiteralPath $settingsPath -Value $settingsContent -Encoding UTF8

      - name: Deploy to Maven Central
        run: mvn -q -Pfrontend,release deploy
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTER_USERNAME: ${{ secrets.CENTER_USERNAME }}
          CENTER_PASSWORD: ${{ secrets.CENTER_PASSWORD }}

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts
          path: release-assets

      - name: Extract tag version
        id: tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF -replace '^refs/tags/', ''
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare release changelog
        id: changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.tag.outputs.version }}'
          $normalizedVersion = $version.TrimStart('v')
          $changelogFile = 'CHANGELOG.md'
          $releaseNotesFile = 'release-notes.md'

          if (-not (Test-Path -LiteralPath $changelogFile)) {
            Set-Content -LiteralPath $releaseNotesFile -Value '未找到 CHANGELOG.md。' -Encoding UTF8
            "path=$releaseNotesFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }

          $lines = Get-Content -LiteralPath $changelogFile -Encoding UTF8
          $capture = $false
          $releaseLines = New-Object System.Collections.Generic.List[string]

          foreach ($line in $lines) {
            $isTargetHeading = $line -match "^## \[($([regex]::Escape($version))|$([regex]::Escape($normalizedVersion)))\]"
            $isOtherHeading = $line -match '^## \[' -and -not $isTargetHeading

            if ($isTargetHeading) {
              $capture = $true
            } elseif ($capture -and $isOtherHeading) {
              break
            }

            if ($capture) {
              $releaseLines.Add($line)
            }
          }

          if ($releaseLines.Count -eq 0) {
            $releaseLines.Add("## $version")
            $releaseLines.Add('')
            $releaseLines.Add('CHANGELOG.md 中没有匹配的版本记录。')
          }

          Set-Content -LiteralPath $releaseNotesFile -Value $releaseLines -Encoding UTF8
          "path=$releaseNotesFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Release ${{ steps.tag.outputs.version }}
          body_path: ${{ steps.changelog.outputs.path }}
          files: release-assets/**/*
