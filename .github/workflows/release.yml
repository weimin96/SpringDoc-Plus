# Release 构建与发布工作流
# 当推送 tag 时触发，构建并发布到 Maven Central

name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # 构建和测试
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 构建项目
        run: mvn -q -DskipTests package

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            */target/*.jar
            */target/*.pom

  # 发布到 Maven Central
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE=${{ secrets.GPG_PASSPHRASE }}

      - name: 创建 Maven settings.xml
        run: |
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>ossrh</id>
                <username>${{ secrets.CENTER_USERNAME }}</username>
                <password>${{ secrets.CENTER_PASSWORD }}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>gpg</id>
                <properties>
                  <gpg.keyname>${{ secrets.GPG_KEY_NAME }}</gpg.keyname>
                  <gpg.passphrase>${{ secrets.GPG_PASSPHRASE }}</gpg.passphrase>
                </properties>
              </profile>
            </profiles>
          </settings>
          EOF

      - name: 发布到 Maven Central
        run: mvn deploy -DskipTests -DskipJavadoc=false -Pgpg
        env:
          CENTER_USERNAME: ${{ secrets.CENTER_USERNAME }}
          CENTER_PASSWORD: ${{ secrets.CENTER_PASSWORD }}
